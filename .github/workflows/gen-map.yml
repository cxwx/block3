name: Generate Attack Map

on:
  push:
    paths:
      - blocklist.dat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests matplotlib geopandas

      - run: |
          wget -q -O /tmp/ne.zip "https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip"
          unzip -q /tmp/ne.zip -d /tmp/ne

      - name: Generate SVG
        run: |
          python3 << 'PYEOF'
          import requests, matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import geopandas as gpd

          with open("blocklist.dat") as f:
              ips = [l.strip() for l in f if l.strip()]

          print(f"Geolocating {len(ips)} IPs...")
          locs = []
          for ip in ips:
              try:
                  d = requests.get(f"https://ipwho.is/{ip}", timeout=10).json()
                  if d.get("success"):
                      locs.append((d["longitude"], d["latitude"]))
                      print(f"  {ip} -> {d['country']}")
              except Exception as e:
                  print(f"  {ip} -> {e}")

          world = gpd.read_file("/tmp/ne/ne_110m_admin_0_countries.shp")
          fig, ax = plt.subplots(figsize=(14, 7))
          world.plot(ax=ax, color="#e0e0e0", edgecolor="#cccccc")
          ax.scatter([l[0] for l in locs], [l[1] for l in locs], c="red", s=40, zorder=5, edgecolors="darkred", linewidths=0.5)
          ax.set_xlim(-180, 180)
          ax.set_ylim(-90, 90)
          ax.set_axis_off()
          fig.tight_layout(pad=0.5)
          fig.savefig("attack_map.svg", format="svg", bbox_inches="tight")
          plt.close(fig)
          print("Done.")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add attack_map.svg
          git diff --cached --quiet || git commit -m "Update attack map"
          git push
